<!DOCTYPE html>
<html>
<head>
<title>Student Result</title>
<style>
body{font-family:Arial; text-align:center; background:#f2f2f2}
.box{background:white; width:300px; margin:100px auto; padding:20px; border-radius:10px}
input, button{padding:10px; width:90%; margin:5px}
</style>
</head>
<body>
<div class="box">
<h2>Result Check</h2>
<input type="text" id="roll" placeholder="Roll Number Daliye">
<button onclick="checkResult()">Search</button>
<div id="result"></div>
</div>

<script>
// Yahan apna data daal sakte ho
const data = {
  "101": {name: "Aman", marks: "485", result: "PASS"},
  "102": {name: "Rahul", marks: "320", result: "PASS"},
  "103": {name: "Suman", marks: "210", result: "FAIL"}
};

function checkResult(){
  let r = document.getElementById("roll").value;
  if(data[r]){
    document.getElementById("result").innerHTML =
    `<hr><b>Name:</b> ${data[r].name}<br><b>Marks:</b> ${data[r].marks}<br><b>Status:</b> ${data[r].result}`;
  } else {
    document.getElementById("result").innerHTML = "Result Not Found!";
  }
}
</script>
</body>
</html>
