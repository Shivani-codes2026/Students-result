*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
body{background:linear-gradient(135deg, #e0f2ff, #f5e6ff); min-height:100vh;}

.header{
  background: linear-gradient(90deg, #0000ff, #7b00ff);
  color:white; text-align:center; padding:25px 15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
  position:sticky; top:0; z-index:10;
}
.header h1{font-size:26px; letter-spacing:1px;}
.header p{font-size:14px; margin-top:5px; opacity:0.95;}

.main{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:25px;
  padding:30px 15px;
}

.card{
  background:white;
  width:100%;
  max-width:420px;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.12);
  transition:0.3s;
}
.card:hover{transform:translateY(-5px); box-shadow:0 15px 40px rgba(0,0,0,0.18);}
.card h2{ text-align:center; margin-bottom:5px; color:#0000ff; }
.card.sub{ text-align:center; font-size:13px; color:#666; margin-bottom:18px; }
.card input{
  width:100%; padding:13px; border:2px solid #ddd; border-radius:10px; outline:none; font-size:15px;
}
.card input:focus{border-color:#0000ff;}
.card button{
  width:100%; margin-top:12px; padding:13px; background:linear-gradient(90deg, #0000ff, #7b00ff);
  color:white; border:none; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer;
}
.output{
  margin-top:15px; background:#f8faff; padding:15px; border-radius:12px; border:1px dashed #a0a0ff; display:none;
}
.output p{font-size:14px; margin:5px 0;}
.pass{color:green; font-weight:bold; font-size:18px; text-align:center; margin-top:10px;}
.fail{color:red; font-weight:bold; font-size:18px; text-align:center; margin-top:10px;}

/* Footer scrolling */
.footer{ background:white; padding:14px 0; overflow:hidden; white-space:nowrap; border-top:2px solid #ddd; }
.track{ display:flex; width:max-content; animation: scroll 25s linear infinite; }
.track img{ width:160px; height:100px; object-fit:cover; margin:0 10px; border-radius:12px; }
@keyframes scroll{ 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

// COMMON FUNCTION - DONO BOX KE LIYE KAAM KAREGA
function checkResult(inputId, outputId, database){
  let roll = document.getElementById(inputId).value.trim();
  let out = document.getElementById(outputId);

  if(roll==""){ alert("Roll No. likho!"); return; }

  if(database[roll]){
    let s = database[roll];
    out.style.display="block";
    out.innerHTML = `
      <p><b>Name:</b> ${s.name}</p>
      <p><b>Total Marks:</b> ${s.marks}</p>
      <div class="${s.result=='PASS'?'pass':'fail'}">${s.result}</div>
    `;
  } else {
    out.style.display="block";
    out.innerHTML = `<p style="color:red; text-align:center;">Roll No. ${roll} nahi mila!</p>`;
  }
}
